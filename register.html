```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | GRAND LAHDA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">GRAND LAHDA</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="reservation.html">Reservations</a></li>
            <li><a href="car wash.html">Car Wash 🚗</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>


    <!-- Register Section -->
    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">
                <h1>Create Your Account</h1>
                <p>Join GRAND LAHDA and manage your restaurant bookings with ease.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your contact number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 GRAND LAHDA. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
```
